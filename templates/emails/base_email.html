<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead Edge Exam Centre</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f9; font-family: Arial, Helvetica, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f9; padding: 40px 20px;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background:#ffffff; border-radius:8px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08);">

          <!-- Header -->
          <tr>
            <td style="background-color:#1B3A5C; padding: 28px 40px;">
              <h1 style="margin:0; color:#ffffff; font-size:22px; font-weight:700; letter-spacing:0.5px;">
                Lead Edge Exam Centre
              </h1>
              <p style="margin:4px 0 0; font-size:13px;">
                <a href="https://leadedgeltd.org" style="color:#ffffff; text-decoration:none;">leadedgeltd.org</a>
              </p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 36px 40px; color:#374151; font-size:15px; line-height:1.7;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding: 0 40px;">
              <hr style="border:none; border-top:1px solid #e5e7eb; margin:0;" />
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 20px 40px; background-color:#f9fafb;">
              <p style="margin:0; font-size:12px; color:#9ca3af; line-height:1.6;">
                &copy; {{ year }} Lead Edge Ltd. All rights reserved.<br />
                If you have questions, contact us at
                <a href="mailto:info@leadedgeltd.org" style="color:#1B3A5C; text-decoration:none;">support@leadedgeltd.org</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
