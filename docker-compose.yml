services:

  api:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    command: gunicorn examinationleadedge.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    environment:
      RUN_MIGRATIONS: "1"
    ports:
      - "8010:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    command: celery -A examinationleadedge worker -l info
    environment:
      RUN_MIGRATIONS: "0"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery_beat:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    command: celery -A examinationleadedge beat -l info --schedule /tmp/celerybeat-schedule
    environment:
      RUN_MIGRATIONS: "0"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  staticfiles:
