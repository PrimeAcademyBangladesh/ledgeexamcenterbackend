services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - /var/data/examcenterleadedge/postgres:/var/lib/postgresql/data
    env_file:
      - /etc/examcenterleadedge/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - /var/data/examcenterleadedge/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      - /etc/examcenterleadedge/.env
    ports:
      - "127.0.0.1:8020:8020"
    volumes:
      - /var/data/examcenterleadedge/media:/app/media
      - /var/data/examcenterleadedge/staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    restart: unless-stopped
    env_file:
      - /etc/examcenterleadedge/.env
    volumes:
      - /var/data/examcenterleadedge/media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A examinationleadedge worker --loglevel=info --concurrency=2

  celery_beat:
    build: .
    restart: unless-stopped
    env_file:
      - /etc/examcenterleadedge/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A examinationleadedge beat --loglevel=info
