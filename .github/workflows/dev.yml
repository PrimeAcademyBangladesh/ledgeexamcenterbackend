name: Leadedge DEV CI/CD

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Build and Deploy DEV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify SSH key
        run: |
          if [ -z "${{ secrets.LEADEDGE_SSH_PRIVATE_KEY }}" ]; then
            echo "SSH key missing"
            exit 1
          else
            echo "SSH key detected"
          fi

      - name: Upload code to DEV server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LEADEDGE_SSH_HOST }}
          username: ${{ secrets.LEADEDGE_SSH_USER }}
          key: ${{ secrets.LEADEDGE_SSH_PRIVATE_KEY }}
          port: ${{ secrets.LEADEDGE_SSH_PORT }}
          source: "./"
          target: "/var/www/examcenterleadedge"
          strip_components: 1
          rm: false

      - name: Deploy containers
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.LEADEDGE_SSH_HOST }}
          username: ${{ secrets.LEADEDGE_SSH_USER }}
          key: ${{ secrets.LEADEDGE_SSH_PRIVATE_KEY }}
          port: ${{ secrets.LEADEDGE_SSH_PORT }}
          script: |
            cd /var/www/examcenterleadedge

            echo "Starting containers..."
            make start

            echo "Deployment completed successfully"