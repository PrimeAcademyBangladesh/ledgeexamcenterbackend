name: leadedge-prod

services:

  api:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: leadedge-prod-api
    command: gunicorn examinationleadedge.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    environment:
      RUN_MIGRATIONS: "1"
    ports:
      - "127.0.0.1:8030:8000"
    env_file:
      - /etc/examcenterleadedge/production/.env
    volumes:
      - .:/app
      - /etc/examcenterleadedge/production/staticfiles:/app/staticfiles
      - /etc/examcenterleadedge/production/media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - leadedge-prod-net

  postgres:
    image: postgres:16
    container_name: leadedge-prod-postgres
    env_file:
      - /etc/examcenterleadedge/production/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - leadedge-prod-net

  redis:
    image: redis:7
    container_name: leadedge-prod-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - leadedge-prod-net

  celery_worker:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: leadedge-prod-celery-worker
    command: celery -A examinationleadedge worker -l info
    environment:
      RUN_MIGRATIONS: "0"
    env_file:
      - /etc/examcenterleadedge/production/.env
    volumes:
      - .:/app
      - /etc/examcenterleadedge/production/media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - leadedge-prod-net

  celery_beat:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: leadedge-prod-celery-beat
    command: celery -A examinationleadedge beat -l info --schedule /tmp/celerybeat-schedule
    environment:
      RUN_MIGRATIONS: "0"
    env_file:
      - /etc/examcenterleadedge/production/.env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - leadedge-prod-net

volumes:
  postgres_data:
  redis_data:

networks:
  leadedge-prod-net:
    driver: bridge
